[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syren"
version = "0.1.0"
description = "Interactive TUI for batch file renaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
]

[project.scripts]
syren = "syren.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.0",
    "pylint>=3.0",
]

[tool.hatch.build.targets.wheel.force-include]
"src" = "syren"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["syren"]
branch = true
omit = ["*/syren/app.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["syren"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.11"
ignore-paths = ["src/app.py"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "duplicate-code",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "use-implicit-booleaness-not-comparison",
]

[tool.uv]
package = true
python-preference = "only-system"
